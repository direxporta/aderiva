name: Update ADeriva podcast

on:
  push:
    paths:
      - '.github/workflows/update-podcast.yml'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-podcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update podcast data from iVoox RSS
        run: node scripts/update-podcast.mjs

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No new episode.'
          else
            git add src/data/podcastEpisodes.ts
            git commit -m 'Update latest iVoox podcast episodes'
            git push
          fi
